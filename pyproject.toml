[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceback"
version = "0.1.0"
description = "Autonomous terminal CLI debugging wrapper powered by Nebius & NVIDIA Nemotron"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[project.scripts]
traceback = "traceback.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "PL", "BLE"]